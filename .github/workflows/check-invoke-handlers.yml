name: "Check invoke handlers"

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/src-tauri/src/lib.rs"
      - "frontend/scripts/check-invoke-handlers.js"
  workflow_dispatch:

jobs:
  check-invoke-handlers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compare invoke() names with generate_handler!
        working-directory: frontend
        run: node scripts/check-invoke-handlers.js
