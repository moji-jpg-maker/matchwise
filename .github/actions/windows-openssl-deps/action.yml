name: Windows OpenSSL build deps
description: >-
  Install Strawberry Perl and NASM and put them on PATH. The vendored OpenSSL
  that SQLCipher is built against (libsqlite3-sys, bundled-sqlcipher-vendored-openssl)
  needs both at build time, and windows-latest runners ship neither.

runs:
  using: composite
  steps:
    - name: Install and verify Perl and NASM
      shell: pwsh
      run: |
        # community.chocolatey.org intermittently answers 504; one blip must not fail the whole build.
        # Install only what is missing, retry with backoff, and accept choco's "success, reboot pending" codes.
        function Install-WithRetry([string]$package, [string]$probe) {
          if (Test-Path $probe) { Write-Host "$package already present at $probe"; return }
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            choco install -y --no-progress $package
            if (@(0, 1641, 3010) -contains $LASTEXITCODE) { return }
            $wait = 20 * $attempt
            Write-Host "choco install $package failed (exit $LASTEXITCODE), attempt $attempt of 5; retrying in ${wait}s"
            Start-Sleep -Seconds $wait
          }
          throw "choco install $package failed after 5 attempts"
        }
        Install-WithRetry 'strawberryperl' 'C:\Strawberry\perl\bin\perl.exe'
        Install-WithRetry 'nasm' 'C:\Program Files\NASM\nasm.exe'

        $perlBin = 'C:\Strawberry\perl\bin'
        $nasmBin = 'C:\Program Files\NASM'
        foreach ($p in @($perlBin, "$perlBin\..\c\bin", $nasmBin)) {
          if (Test-Path $p) { $p | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
        }

        # Fail here rather than 10 minutes later inside openssl-src.
        if (-not (Test-Path "$perlBin\perl.exe")) { throw "Strawberry Perl missing at $perlBin\perl.exe" }
        if (-not (Test-Path "$nasmBin\nasm.exe")) { throw "NASM missing at $nasmBin\nasm.exe" }

        & "$perlBin\perl.exe" -v
        & "$nasmBin\nasm.exe" -v
